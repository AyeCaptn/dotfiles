set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g extended-keys on
set -g extended-keys-format csi-u

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split windows
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Refresh tmux config with r
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Maximize pane
bind -r m resize-pane -Z

# Create windows in the current path
bind c new-window -c "#{pane_current_path}"

# Kill panes/windows without prompting
bind x kill-pane
bind X kill-window

# Enable the mouse
set -g mouse on

# Let terminal/editor focus events flow through tmux.
set -g focus-events on

# Keep tmux alive when the attached session is destroyed.
set -g detach-on-destroy off

# Use the system clipboard when supported by the terminal.
set -g set-clipboard on

# Disable escape delay
set -sg escape-time 0

# Make status/messages feel responsive without being noisy.
set -g display-time 4000
set -g status-interval 5

# Set the history scrollback limit
set-option -g history-limit 100000

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set vi mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy' # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'catppuccin/tmux'

set -g @catppuccin_flavour 'macchiato'
set -g @catppuccin_window_status_enable 'yes'
set -g @catppuccin_window_status_icon_enable 'yes'
set -g @catppuccin_window_status_style 'basic'

set -g @catppuccin_window_default_text ' #{b:pane_current_path}'
set -g @catppuccin_window_text ' #{b:pane_current_path}'
set -g @catppuccin_window_current_text ' #{b:pane_current_path}'

# Bottom bar with no hostname, date, or time.
set -g status-position bottom
set -g @catppuccin_status_modules_left ''
set -g @catppuccin_status_modules_right ''
set -g status-left ''
set -g status-right ''
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'off' # enable tmux-continuum functionality
set -g @continuum-save-interval '2' # save tmux sessions every 2 minutes


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
