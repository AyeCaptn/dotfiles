[deno]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[zig]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[haxe]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[julia]
