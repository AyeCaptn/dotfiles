palette = "catppuccin_macchiato"
add_newline = true

format = """
$directory[\uE0B4](fg:blue bg:yellow)$git_branch$git_status[\uE0B4](fg:yellow bg:green)$python$nodejs$rust$golang$java$scala$kotlin$swift$dart$php$ruby$elixir$deno$zig$haxe$julia$lua$maven$helm$kubernetes[\uE0B4](fg:green bg:peach)$aws[\uE0B4 ](fg:peach)$fill
$line_break$status$character"""

right_format = """$cmd_duration$time"""

[directory]
format = "[\uE0B6](fg:blue)[ \uF07B $path ](bold fg:crust bg:blue)"
truncation_length = 3
truncation_symbol = ".../"
home_symbol = "~"

[directory.substitutions]
"Development" = "Dev"
"Projects" = "Projects"

[git_branch]
style = "bg:yellow"
format = "[ \uE0A0 $branch ](fg:crust bg:yellow)"

[git_status]
style = "bg:yellow"
format = "[ $all_status$ahead_behind ](fg:crust bg:yellow)"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "x${count}"
stashed = "*${count}"

[python]
style = "bg:green"
format = "[ $symbol$version $virtualenv ](fg:crust bg:green)"
symbol = "\uE73C "

[nodejs]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[rust]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[golang]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[java]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[scala]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[kotlin]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

