format = "[ $symbol $version ](fg:crust bg:green)"

[maven]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[helm]
style = "bg:green"
format = "[ $symbol $version ](fg:crust bg:green)"

[kubernetes]
disabled = false
detect_files = ["Chart.yaml", "kustomization.yaml", "kustomization.yml"]
detect_folders = ["k8s", "kubernetes", "manifests"]
style = "bg:green"
format = "[ $symbol$context/$namespace ](fg:crust bg:green)"

[aws]
format = "[ $symbol$profile ](bold fg:crust bg:peach)"
symbol = "☁️ "

[fill]
symbol = " "

[cmd_duration]
min_time = 2_000
format = "[\uE0B2](fg:surface1)[ \uF252 $duration ](fg:text bg:surface1)[\uE0B4](fg:surface1) "

[time]
disabled = false
format = "[\uE0B2](fg:surface0)[ \uF017 $time ](fg:text bg:surface0)[\uE0B4](fg:surface0)"
time_format = "%H:%M"

[status]
disabled = false
format = "[✘ $status ](red)"

[character]
success_symbol = "[❯](lavender)"
error_symbol = "[❯](red)"

