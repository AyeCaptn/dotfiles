"$schema" = "https://starship.rs/config-schema.json"

format = "$directory$git_branch$git_status$mise$cmd_duration$line_break$status$character"
palette = "catppuccin_macchiato"
add_newline = false
scan_timeout = 20

[directory]
style = "bold lavender"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"

[git_branch]
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "peach"
format = "[$all_status$ahead_behind]($style)"

[mise]
style = "blue"

[cmd_duration]
min_time = 2000
style = "overlay1"
format = "took [$duration]($style) "

[status]
disabled = false
format = "[$status]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
overlay1 = "#8087a2"
surface0 = "#363a4f"
base = "#24273a"
crust = "#181926"
